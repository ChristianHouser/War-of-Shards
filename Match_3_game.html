// Walks the explosion queue one item at a time (a plain loop can't pause
// for the player's Runic Crystal choice, so this recurses via callback
// instead). Bomb/crystal handlers may push more items onto `queue` for a
// chain reaction — since we always advance to idx+1, anything appended
// while processing idx is still visited later in the same walk.
function processExplosionQueue(queue, idx, toClear, queuedKeys, logParts, done) {
  if (idx >= queue.length) { done(); return; }
  const item = queue[idx];
  if (item.type === 'bomb') {
    applyBombExplosion(item, toClear, queue, queuedKeys, logParts);
    processExplosionQueue(queue, idx + 1, toClear, queuedKeys, logParts, done);
  } else {
    showCrystalChoiceModal(item.color, (choice) => {
      applyCrystalEffect(item, choice, toClear, queue, queuedKeys, logParts);
      processExplosionQueue(queue, idx + 1, toClear, queuedKeys, logParts, done);
    });
  }
}

// Processes one full match-resolution wave: detects same-color connected
// groups, grants mana, spawns Arcane Bombs (4-cell groups) / Runic Crystals
// (5+-cell groups), and explodes any pre-existing special tile caught in
// this wave's matched cells. `swapHint` ([{x,y},{x,y}], optional) biases a
// newly-spawned special toward the cell the player's own swap landed on.
// `activationSeeds` ([{x,y,color,type}], optional) are special tiles the
// player deliberately activated without necessarily forming a new match —
// an Arcane Bomb via a swap that touches it, or a Runic Crystal via a
// direct tap — see attemptTileSwap/activateSpecialTap — resolved through
// the same explosion-queue machinery.
function processMatches(swapHint, activationSeeds) {
  const groups = findMatchGroups();
  if (groups.length === 0 && (!activationSeeds || activationSeeds.length === 0)) {
    isAnimating = false;
    checkAutoEndPlayerTurn();
    return;
  }

  const preExisting = boardSpecial.map(row => row.slice());
  const toClear = new Set();
  const spawns = [];
  const explosionQueue = [];
  const queuedKeys = new Set();
  const logParts = [];

  function queueExplosionIfSpecial(x, y) {
    const type = preExisting[y][x];
    if (!type) return;
    // A pre-existing Bomb or Crystal caught in a fresh same-color match
    // (its cell joins a newly-formed >=3 connected group — i.e. the player
    // swapped in at least two more tiles of its color, connected to it)
    // auto-activates: a Bomb detonates, a Crystal opens its choice modal —
    // same as a direct tap does for either (see activateSpecialTap). This is
    // in addition to a Bomb's own "any adjacent swap touches it" trigger.
    const k = `${x},${y}`;
    if (queuedKeys.has(k)) return;
    queuedKeys.add(k);
    explosionQueue.push({x, y, color: board[y][x], type});
  }

  (activationSeeds || []).forEach(seed => {
    const k = `${seed.x},${seed.y}`;
    if (queuedKeys.has(k)) return;
    queuedKeys.add(k);
    explosionQueue.push(seed);
  });

  groups.forEach(group => {
    const spawnType = group.cells.length >= 5 ? 'crystal' : group.cells.length === 4 ? 'bomb' : null;
    const spawnCell = spawnType ? pickSpawnCell(group, swapHint) : null;
    group.cells.forEach(c => {
      if (spawnCell && c.x === spawnCell.x && c.y === spawnCell.y) {
        queueExplosionIfSpecial(c.x, c.y); // overwriting a pre-existing special still "matches" it
        return;
      }
      toClear.add(`${c.x},${c.y}`);
      queueExplosionIfSpecial(c.x, c.y);
    });
    if (spawnCell) spawns.push({x: spawnCell.x, y: spawnCell.y, color: group.color, type: spawnType});
    const gain = group.cells.length; // 1 mana per tile, every tier
    const grantedTo = grantMana(group.color, gain);
    logParts.push(`${group.color} +${gain}${spawnCell ? ` (spawns ${spawnType === 'crystal' ? 'Runic Crystal' : 'Arcane Bomb'})` : ''}${grantedTo === 0 ? ' (no hero of this color)' : ''}`);
  });
  if (logParts.length > 0) log(`Match! ${logParts.join(' | ')}`);

  processExplosionQueue(explosionQueue, 0, toClear, queuedKeys, logParts, () => {
    toClear.forEach(k => {
      const [cx, cy] = k.split(',').map(Number);
      spawnManaShards(cx, cy, board[cy][cx]); // fire-and-forget visual flourish, before the cell's color is gone
      board[cy][cx] = null;
      boardSpecial[cy][cx] = null;
    });
    spawns.forEach(s => {
      if (toClear.has(`${s.x},${s.y}`)) return; // consumed by an explosion before it could spawn
      board[s.y][s.x] = s.color;
      boardSpecial[s.y][s.x] = s.type;
    });
    renderBoard();

    setTimeout(() => {
      applyGravityAndFill();
      renderBoard();

      setTimeout(() => {
        const again = findMatchedCells();
        if (again.hasMatches) {
          processMatches(); // cascades never carry a swap hint or activation seed
        } else {
          isAnimating = false;
          checkAutoEndPlayerTurn();
        }
      }, 220);
    }, 280);
  });
}

// ---------- BOARD TILE DRAG-TO-SWAP ----------
// Tap-and-hold a tile, then drag/swipe it onto a neighboring tile (up,
// down, left, right) to swap — the standard match-3 gesture (Candy Crush
// and friends). The swap fires as soon as the drag crosses a small
// distance threshold in a clear direction; no need to release first, and
// only one swap can happen per press-drag gesture. A plain tap (no drag)
// does nothing on an ordinary tile — the exceptions are the two special
// tiles (Arcane Bomb, Runic Crystal), which activate immediately on a tap
// regardless of drag distance (see activateSpecialTap below).
const TILE_SWIPE_THRESHOLD_PX = 16;
let tileDragState = null; // {x, y, pointerId, startClientX, startClientY, swapped}

function onTilePointerDown(e, x, y) {
  if (tileDragState) return; // a gesture is already in progress (e.g. a second finger) — ignore
  if (gamePhase !== 'battle' || isAnimating || currentTurn !== 'player') return;
  if (swapUsedThisTurn) {
    log('You already used this turn\'s one board action (swap or crystal tap) — attack with anyone who can, then the turn ends.');
    return;
  }
  if (aimedTarget) {
    aimedTarget = null;
    heroes.forEach(updateHeroUI);
  }
  if (!board[y][x]) return; // ignore presses on empty tiles

  e.preventDefault();
  tileDragState = { x, y, pointerId: e.pointerId, startClientX: e.clientX, startClientY: e.clientY, swapped: false };
  const el = getTileEl(x, y);
  if (el) el.classList.add('selected');
  window.addEventListener('pointermove', onTilePointerMove);
  window.addEventListener('pointerup', onTilePointerUp);
  window.addEventListener('pointercancel', onTilePointerCancel);
}

function onTilePointerMove(e) {
  if (!tileDragState || tileDragState.swapped || e.pointerId !== tileDragState.pointerId) return;
  const dx = e.clientX - tileDragState.startClientX;
  const dy = e.clientY - tileDragState.startClientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < TILE_SWIPE_THRESHOLD_PX) return;

  const { x, y } = tileDragState;
  const horizontal = Math.abs(dx) > Math.abs(dy);
  const nx = horizontal ? x + (dx > 0 ? 1 : -1) : x;
  const ny = horizontal ? y : y + (dy > 0 ? 1 : -1);
  tileDragState.swapped = true; // only one swap per gesture — ignore any further movement
  endTileDrag();
  attemptTileSwap(x, y, nx, ny);
}

function onTilePointerUp(e) {
  if (!tileDragState || e.pointerId !== tileDragState.pointerId) return;
  const { x, y, swapped } = tileDragState;
  endTileDrag();
  if (swapped) return; // already handled in onTilePointerMove

  // No drag happened — a plain tap. Both special tiles respond to this:
  // for a Crystal it's one of its two triggers; for a Bomb it's a third
  // way in, alongside being matched into a group or touched by a swap.
  const type = boardSpecial[y][x];
  if (type === 'crystal' || type === 'bomb') activateSpecialTap(x, y, type);
}

function onTilePointerCancel(e) {
  if (!tileDragState || e.pointerId !== tileDragState.pointerId) return;
  endTileDrag();
}

function endTileDrag() {
  if (tileDragState) {
    const el = getTileEl(tileDragState.x, tileDragState.y);
    if (el) el.classList.remove('selected');
  }
  tileDragState = null;
  window.removeEventListener('pointermove', onTilePointerMove);
  window.removeEventListener('pointerup', onTilePointerUp);
  window.removeEventListener('pointercancel', onTilePointerCancel);
}

// A direct tap on a Bomb or Crystal activates it immediately (opens the
// Crystal's choice modal, or detonates the Bomb). For a Crystal this is
// one of its two triggers, the other being caught in a fresh same-color
// match (see queueExplosionIfSpecial); a Crystal's own cell can also never
// be one half of a swap (see the guard in attemptTileSwap), so tapping is
// its only way to trigger deliberately. A Bomb has no such restriction —
// it can still be dragged into a swap (which also activates it, matched
// or not) — this tap is simply an additional, faster way to set it off
// without needing a neighbor to swap with. Counts as this turn's one
// board action either way.
function activateSpecialTap(x, y, type) {
  const el = getTileEl(x, y);
  if (el) el.classList.add('selected');
  isAnimating = true;
  swapUsedThisTurn = true;
  setBoardLocked(true);
  setTimeout(() => {
    if (el) el.classList.remove('selected');
    processMatches(null, [{x, y, color: board[y][x], type}]);
  }, 120);
}

// Performs the actual data swap, then a FLIP-style slide so the two tiles
// visually glide to each other's grid position instead of just
// "teleporting" the moment renderBoard() rebuilds them. Reused for a
// revert too — swapping the same pair a second time restores the original
// arrangement, sliding back the way it came.
const SWAP_SLIDE_MS = 160;
function animateTileSwap(x1, y1, x2, y2, onDone) {
  const rect1 = getTileEl(x1, y1).getBoundingClientRect();
  const rect2 = getTileEl(x2, y2).getBoundingClientRect();

  const tmpColor = board[y1][x1], tmpSpecial = boardSpecial[y1][x1];
  board[y1][x1] = board[y2][x2]; boardSpecial[y1][x1] = boardSpecial[y2][x2];
  board[y2][x2] = tmpColor; boardSpecial[y2][x2] = tmpSpecial;
  renderBoard();

  const el1 = getTileEl(x1, y1); // now shows what used to be at (x2,y2)
  const el2 = getTileEl(x2, y2); // now shows what used to be at (x1,y1)
  el1.style.zIndex = '10';
  el2.style.zIndex = '10';
  el1.style.transition = 'none';
  el2.style.transition = 'none';
  el1.style.transform = `translate(${rect2.left - rect1.left}px, ${rect2.top - rect1.top}px)`;
  el2.style.transform = `translate(${rect1.left - rect2.left}px, ${rect1.top - rect2.top}px)`;
  void el1.offsetWidth; // force reflow so the jump above commits before animating back to translate(0,0)
  requestAnimationFrame(() => {
    el1.style.transition = `transform ${SWAP_SLIDE_MS}ms ease`;
    el2.style.transition = `transform ${SWAP_SLIDE_MS}ms ease`;
    el1.style.transform = 'translate(0,0)';
    el2.style.transform = 'translate(0,0)';
  });
  setTimeout(onDone, SWAP_SLIDE_MS);
}

// Slides the two tiles to each other's position first (see animateTileSwap
// above), then checks whether the swap created a match or touched an
// Arcane Bomb (which activates from any adjacent swap, matched or not) —
// reverts (with its own slide back) if neither happened. A Runic Crystal
// can never be one half of a swap; dragging onto or off of one is simply a
// no-op (use activateSpecialTap's direct-tap path instead).
function attemptTileSwap(x1, y1, x2, y2) {
  if (x2 < 0 || x2 >= COLS || y2 < 0 || y2 >= ROWS) return; // dragged off the edge of the board
  if (!board[y1][x1] || !board[y2][x2]) return;
  if (boardSpecial[y1][x1] === 'crystal' || boardSpecial[y2][x2] === 'crystal') return;

  isAnimating = true;
  setBoardLocked(true);

  animateTileSwap(x1, y1, x2, y2, () => {
    const {hasMatches} = findMatchedCells();
    const activationSeeds = [];
    if (boardSpecial[y1][x1] === 'bomb') activationSeeds.push({x: x1, y: y1, color: board[y1][x1], type: 'bomb'});
    if (boardSpecial[y2][x2] === 'bomb') activationSeeds.push({x: x2, y: y2, color: board[y2][x2], type: 'bomb'});

    if (hasMatches || activationSeeds.length > 0) {
      swapUsedThisTurn = true; // a turn only gets one swap
      const swapHint = [{x: x1, y: y1}, {x: x2, y: y2}];
      processMatches(swapHint, activationSeeds);
    } else {
      // revert: swap back with the same slide animation
      animateTileSwap(x1, y1, x2, y2, () => {
        isAnimating = false;
        setBoardLocked(false);
        log('No match – swap reverted');
      });
    }
  });
}

btnBasic.onclick = () => {

};

btnDoNothing.onclick = () => {

  const h = pendingActionHero;

  modal.style.display = 'none';

  log(`${h.name} does nothing this turn.`);

};

btnCancel.onclick = () => {
  pendingActionHero = null;
  modal.style.display = 'none';
  log('Attack cancelled.');
};

// A normal (non-special) character has no per-hero "Do Nothing" option and
// must attack with its Basic if it can afford it — End Turn can only skip
// the *optional* choice Heroes (isSpecial) get, never a mandatory normal
// attack. Returns the first such character still owed its attack, or
// undefined if none remain.
function normalCharacterMustActFirst() {
  return heroes.find(h => h.side === 'player' && !h.dead && !h.isSpecial &&
    !h.actedThisTurn && h.mana >= basicCostFor(h));
}

// Grays out the End Turn button (and blocks clicks via `disabled`) whenever
// it isn't actually usable yet: outside the player's turn, before the
// turn's swap, or while a normal character still owes its mandatory
// attack. Called from updateHeroUI/updateTurnUI/checkAutoEndPlayerTurn so
// it stays in sync with every state change that could affect eligibility.
function updateEndTurnButtonState() {
  const btn = document.getElementById('btn-end-turn');
  if (!btn) return;
  const ready = gamePhase === 'battle' && currentTurn === 'player' &&
    swapUsedThisTurn && !normalCharacterMustActFirst();
  btn.disabled = !ready;
  btn.style.opacity = ready ? '1' : '0.4';
  btn.style.cursor = ready ? 'pointer' : 'not-allowed';
}

// Lets the player skip straight to the enemy turn — banking mana for every
// living Hero that hasn't acted yet — instead of opening each Hero's action
// popup individually just to hit "Do Nothing". Still requires the turn's
// swap first, same as attacking does, and is blocked while any normal
// character can still make its mandatory attack.
document.getElementById('btn-end-turn').onclick = () => {
  if (gamePhase !== 'battle' || isAnimating || currentTurn !== 'player') return;
  if (!swapUsedThisTurn) {
    log('Swap two tiles first — end turn is available after your swap.');
    return;
  }
  const mustAct = normalCharacterMustActFirst();
  if (mustAct) {
    log(`${mustAct.name} can still attack and has no Do Nothing option — it must attack before you can end your turn.`);
    return;
  }
  pendingActionHero = null;
  if (modal) modal.style.display = 'none';
  heroes.filter(h => h.side === 'player' && !h.dead && !h.actedThisTurn)
    .forEach(h => { h.actedThisTurn = true; });
  heroes.forEach(updateHeroUI);
  log('You end your turn, banking remaining mana.');
  endPlayerTurn();
};

// Toggles Auto Attack on/off. Doesn't reset when a new battle starts —
// treated as a standing player preference ("how do I want to play"),
// same as e.g. a settings checkbox, not per-battle state. Turning it on
// immediately checks whether there's already something to resolve this
// turn (e.g. flipped mid-turn after a swap), rather than waiting for the
// next action to happen to notice.
document.getElementById('btn-auto-attack').onclick = () => {
  autoAttackEnabled = !autoAttackEnabled;
  const btn = document.getElementById('btn-auto-attack');
  btn.textContent = autoAttackEnabled ? '▶ Auto: ON' : '▶ Auto: OFF';
  btn.classList.toggle('on', autoAttackEnabled);
  if (autoAttackEnabled) checkAutoEndPlayerTurn();
  else cancelAutoAttack();
};

// Which ranged lanes are currently protected by a living melee hero on the
// given side (each melee hero carries its own `coverage`, assigned at
// deployment — either aligned to one lane, a boundary between two, or null).
function getCoveredLanes(side) {
  const covered = new Set();
  heroes.forEach(h => {
    if (h.side === side && h.type === 'melee' && !h.dead && h.coverage) {
      if (h.coverage.type === 'aligned') covered.add(h.coverage.lane);
      else if (h.coverage.type === 'boundary') h.coverage.lanes.forEach(l => covered.add(l));
    }
  });
  return covered;
}

// Melee can always reach enemy Melee. Melee can only reach a specific enemy
// Ranged lane once no living enemy Melee occupies a slot covering that lane
// (fully aligned or half-step boundary). Ranged can always attack anyone.
function getValidTargets(attacker) {
  const enemySide = attacker.side === 'player' ? 'enemy' : 'player';
  const enemyMelee = heroes.filter(h => h.side === enemySide && h.type === 'melee' && !h.dead);
  const enemyRanged = heroes.filter(h => h.side === enemySide && h.type === 'ranged' && !h.dead);
  if (attacker.type === 'ranged') return [...enemyMelee, ...enemyRanged];
  const coveredLanes = getCoveredLanes(enemySide);
  const reachableRanged = enemyRanged.filter(h => !coveredLanes.has(h.laneIndex));
  return [...enemyMelee, ...reachableRanged];
}

// A hero's "lane" for tie-breaking purposes, unified across both types:
// Ranged has a real laneIndex; Melee has no lane of its own, so it uses the
// lane its coverage is primarily anchored to (primaryLane already handles
// aligned-vs-boundary-vs-none — see its own comment, ~line 995).
function heroLane(h) {
  return h.type === 'ranged' ? h.laneIndex : primaryLane(h.coverage);
}

// Whether a living player hero could act right now if tapped — same set of
// checks onHeroClick's attacker branch runs, kept in sync here purely for
// the "glowing" can-act visual cue (updateHeroUI), not for gating itself.
function canHeroAct(h) {
  return gamePhase === 'battle' && currentTurn === 'player' && !isAnimating &&
    h.side === 'player' && !h.dead && !h.actedThisTurn &&
    swapUsedThisTurn && h.mana >= basicCostFor(h);
}

// Logical Targeting: the default target when the player doesn't pre-aim.
// Ranked among only the legal targets (getValidTargets already encodes the
// melee-vs-guarded-ranged rule — this never considers raw pixel/visual
// distance) by:
//   1. Highest current mana — SPECIAL_COST is the same flat threshold for
//      every character, so raw mana directly ranks "closest to Special".
//   2. Then lowest HP — finish off the weakest.
//   3. Then nearest lane to the attacker's own.
function pickLogicalTarget(attacker) {
  const targets = getValidTargets(attacker);
  if (targets.length === 0) return null;
  const attackerLane = heroLane(attacker);
  return targets.slice().sort((a, b) => {
    if (b.mana !== a.mana) return b.mana - a.mana;
    if (a.hp !== b.hp) return a.hp - b.hp;
    return Math.abs(heroLane(a) - attackerLane) - Math.abs(heroLane(b) - attackerLane);
  })[0];
}

// Resolves an attack once the attacker + attack type are decided (either
// immediately, for a normal character's one-tap attack, or after the
// player's modal choice for a Hero). Uses the player's pre-aimed target if
// they set one (tap an enemy, then a hero) and it's still legal for this
// specific attacker; otherwise falls back to the Logical Target. Aim is
// single-use — cleared here regardless of which path was taken.
function resolveAttack(attacker, attackType) {
  let target = null;
  if (aimedTarget && !aimedTarget.dead && getValidTargets(attacker).includes(aimedTarget)) {
    target = aimedTarget;
  } else {
    target = pickLogicalTarget(attacker);
  }
  aimedTarget = null;
  heroes.forEach(updateHeroUI);
  if (!target) {
    log(`${attacker.name} has no valid target to attack.`);
    return;
  }
  performAttack(attacker, target, attackType);
}

function onHeroClick(h) {
  if (gamePhase !== 'battle' || isAnimating || h.dead || currentTurn !== 'player') return;

  // Only left side (player) can be an attacker
  if (h.side === 'player') {
    if (!swapUsedThisTurn) {
      log('Swap two tiles first — attacks come after your swap.');
      return;
    }
    if (h.actedThisTurn) {
      log(`${h.name} already acted this turn.`);
      return;
    }

    const myBasicCost = basicCostFor(h);
    if (h.mana < myBasicCost) {
      log(`${h.name} needs at least ${myBasicCost} mana (has ${h.mana})`);
      return;
    }

    // Only heroes with multiple attack choices (specials) get the action
    // popup with a "Do Nothing" option. Normal heroes have just one option
    // (Basic Attack), so tapping them attacks immediately.
    if (h.isSpecial) {
      pendingActionHero = h;
      modalTitle.textContent = `${h.name} ★${h.abilityName ? ' — ' + h.abilityName : ''} (mana: ${h.mana}/${h.maxMana})`;
      btnBasic.textContent = `Basic (${myBasicCost} mana → ${basicDmgFor(h)} dmg)`;
      btnBasic.style.opacity = h.mana >= myBasicCost ? '1' : '0.4';
      btnBasic.disabled = h.mana < myBasicCost;
      btnSpecial.textContent = `Special (${SPECIAL_COST} mana → ${SPECIAL_DMG} dmg)${h.abilityText ? ' — ' + h.abilityText : ''}`;
      btnSpecial.style.opacity = h.mana >= SPECIAL_COST ? '1' : '0.4';
      btnSpecial.disabled = h.mana < SPECIAL_COST;
      modal.style.display = 'flex';
      return;
    }

    // Normal character → immediate Basic attack: no popup, no second tap
    // on an enemy needed. Uses the pre-aimed target if one was set (tap an
    // enemy first), else the Logical Target.
    resolveAttack(h, 'basic');
  } else {
    // Right side = enemy → optional pre-aim, never itself an attack. Tap
    // the already-aimed enemy again to clear it. A subsequent tap on a
    // player hero (direct, or via the modal's Basic/Special choice) is
    // what actually attacks — see resolveAttack.
    if (aimedTarget === h) {
      aimedTarget = null;
    } else {
      aimedTarget = h;
    }
    heroes.forEach(updateHeroUI);
  }
}

function performAttack(attacker, target, attackType) {
  if (attacker.dead || target.dead) return;

  let cost, dmg, usedSpecial = false;
  const targetWasDamaged = target.hp < target.maxHp;
  const targetWasLowHp = target.hp <= 3;

  if (attackType === 'special') {
    if (!attacker.isSpecial) { log(`${attacker.name} has no Special attack.`); return; }
    if (attacker.mana < SPECIAL_COST) {
      log('Not enough mana for Special.');
      return;
    }
    cost = SPECIAL_COST;
    dmg = SPECIAL_DMG;
    usedSpecial = true;
    // Simple, already-implemented special effects (flat modifiers only —
    // see characters.js header for what's wired up vs. description-only).
    if (attacker.simpleAbility === 'divineStrike' && targetWasDamaged) dmg += 1;
    if (attacker.simpleAbility === 'brutal' && targetWasLowHp) dmg += 1;
  } else {
    cost = basicCostFor(attacker);
    if (attacker.mana < cost) {
      log('Not enough mana.');
      return;
    }
    dmg = basicDmgFor(attacker);
  }

  attacker.mana -= cost;
  triggerHeroPose(attacker, 'attack');
  target.hp -= dmg;
  triggerHeroPose(target, 'impacted');
  if (target.hp <= 0) {
    target.hp = 0;
    target.dead = true;
    log(`${attacker.name}${usedSpecial ? ' ★' : ''} defeated ${target.name}!`);
  } else {
    log(`${attacker.name}${usedSpecial ? ' ★' : ''} hit ${target.name} for ${dmg} (${target.hp} HP left)`);
  }

  if (attacker.simpleAbility === 'frenzy') {
    const before = attacker.mana;
    attacker.mana = Math.min(attacker.maxMana, attacker.mana + 1);
    if (attacker.mana > before) log(`${attacker.name}'s Frenzy grants +1 mana.`);
  }

  attacker.actedThisTurn = true;
  updateHeroUI(attacker);
  updateHeroUI(target);
  heroes.forEach(updateHeroUI);

  const enemiesAlive = heroes.filter(h => h.side === 'enemy' && !h.dead).length;
  const playersAlive = heroes.filter(h => h.side === 'player' && !h.dead).length;
  if (enemiesAlive === 0) {
    log('🎉 YOU WIN! All enemies defeated.');
    currentTurn = 'none';
    updateTurnUI();
    return;
  }
  if (playersAlive === 0) {
    log('💀 DEFEAT — all your heroes have fallen.');
    currentTurn = 'none';
    updateTurnUI();
    return;
  }

  checkAutoEndPlayerTurn();
}

// ---------- AUTO ATTACK (optional, battlefield-only — the Match-3 board
// always stays fully manual) ----------
// When enabled, each living player hero that can afford its Basic Attack
// auto-resolves against a random valid target — same target-picking rule
// the enemy AI already uses (getValidTargets), just semi-logical rather
// than tactical. A Hero (isSpecial) that can already afford its Special
// always uses it (no reason to hold back a bigger attack it can already
// use); one that can only afford Basic gets a random chance to bank mana
// instead — "saving for a greater attack" — same as manually picking Do
// Nothing. Normal characters have no such option and always attack, same
// rule as manual play. Paced one hero at a time via scheduleAutoAttack's
// delay so the player can actually follow what's happening, rather than
// every hero resolving in the same instant.
let autoAttackEnabled = false;
let autoAttackTimeoutHandle = null;
const AUTO_ATTACK_DELAY_MS = 500;
const AUTO_ATTACK_BANK_CHANCE = 0.4; // odds a Hero holds a Basic-affordable turn to save toward Special

function scheduleAutoAttack() {
  if (autoAttackTimeoutHandle) return; // a hop is already queued
  autoAttackTimeoutHandle = setTimeout(() => {
    autoAttackTimeoutHandle = null;
    runNextAutoAttack();
  }, AUTO_ATTACK_DELAY_MS);
}

function cancelAutoAttack() {
  if (autoAttackTimeoutHandle) {
    clearTimeout(autoAttackTimeoutHandle);
    autoAttackTimeoutHandle = null;
  }
}

// Resolves exactly ONE hero's action, then relies on performAttack (or, for
// the no-action branches below, a direct call) to re-invoke
// checkAutoEndPlayerTurn() — which schedules the next hop via
// scheduleAutoAttack() if more heroes remain, or ends the turn once
// everyone's resolved. This mirrors how the manual per-hero flow already
// chains through checkAutoEndPlayerTurn() after every action.
function runNextAutoAttack() {
  if (!autoAttackEnabled || gamePhase !== 'battle' || currentTurn !== 'player' || isAnimating) return;
  const hero = heroes.find(h => h.side === 'player' && !h.dead && !h.actedThisTurn && h.mana >= basicCostFor(h));
  if (!hero) return; // nothing eligible right now; checkAutoEndPlayerTurn's own allResolved check handles ending the turn

  const targets = getValidTargets(hero);
  if (targets.length === 0) {
    hero.actedThisTurn = true;
    updateHeroUI(hero);
    checkAutoEndPlayerTurn();
    return;
  }
  const target = targets[Math.floor(Math.random() * targets.length)];

  if (hero.isSpecial && hero.mana < SPECIAL_COST && Math.random() < AUTO_ATTACK_BANK_CHANCE) {
    hero.actedThisTurn = true;
    log(`${hero.name} (Auto) saves mana for a bigger attack.`);
    updateHeroUI(hero);
    checkAutoEndPlayerTurn();
    return;
  }

  const useSpecial = hero.isSpecial && hero.mana >= SPECIAL_COST;
  performAttack(hero, target, useSpecial ? 'special' : 'basic');
}

// Once every living player hero is resolved for this turn, automatically
// hand the turn to the enemy. Player is always the attacker on the left
// side; enemy only ever acts after the player is done.
// A hero is "resolved" when: it attacked, OR (special only) it chose Do
// Nothing, OR it simply can't afford its own Basic Attack cost (normal
// heroes have no "Do Nothing" and must attack if they're able to).
function checkAutoEndPlayerTurn() {
  // Refresh every hero's card (not just whichever ones the preceding action
  // directly touched, e.g. grantMana() only updates heroes of the matched
  // color) — the can-act glow and full-mana glow both depend on state
  // (swapUsedThisTurn, currentTurn, etc.) that changes independently of
  // any one hero's own mana/HP, so they'd otherwise go stale for anyone
  // not directly involved in the triggering action.
  heroes.forEach(updateHeroUI);
  if (currentTurn !== 'player' || isAnimating) return;
  if (!swapUsedThisTurn) return; // a turn always includes a swap — can't end before that happens
  const livingPlayers = heroes.filter(h => h.side === 'player' && !h.dead);
  if (livingPlayers.length === 0) return;
  const allResolved = livingPlayers.every(h => {
    if (h.actedThisTurn) return true;
    if (h.mana < basicCostFor(h)) return true;
    return false;
  });
  if (allResolved) {
    log('All your heroes have acted — enemy turn begins.');
    endPlayerTurn();
    return;
  }
  if (autoAttackEnabled) scheduleAutoAttack();
}

function updateTurnUI() {
  const el = document.getElementById('turn-indicator');
  if (!el) return;
  if (currentTurn === 'player') {
    el.textContent = swapUsedThisTurn
      ? 'Your Turn — swap used, attack with anyone who can'
      : 'Your Turn — swap two tiles, then attack';
    el.style.color = '#0ff';
  } else if (currentTurn === 'enemy') {
    el.textContent = 'Enemy Turn...';
    el.style.color = '#f55';
  } else {
    el.textContent = 'Battle Over';
    el.style.color = '#ff0';
  }
  updateEndTurnButtonState();
}

function endPlayerTurn() {
  if (currentTurn !== 'player' || isAnimating) return;
  aimedTarget = null;
  endTileDrag();
  cancelAutoAttack();
  heroes.forEach(updateHeroUI);
  currentTurn = 'enemy';
  setBoardLocked(true);
  updateTurnUI();
  log('—— Enemy turn ——');
  setTimeout(enemyTurn, ENEMY_TURN_START_DELAY_MS);
}

// A short beat between "Enemy Turn..." appearing and the enemy actually
// acting, so the turn handoff reads as a deliberate pause rather than an
// instant cut — direct request ("give a slight pause before the enemy goes").
const ENEMY_TURN_START_DELAY_MS = 900;

function enemyTurn() {
  if (currentTurn !== 'enemy') return;

  // Give a little mana to 1–2 random living enemies (simulates their "match")
  const livingEnemies = heroes.filter(h => h.side === 'enemy' && !h.dead);
  if (livingEnemies.length === 0) {
    currentTurn = 'player';
    updateTurnUI();
    return;
  }

  // Boost 1 or 2 enemies
  const shuffled = [...livingEnemies].sort(() => Math.random() - 0.5);
  const toBoost = shuffled.slice(0, Math.min(2, shuffled.length));
  toBoost.forEach(h => {
    h.mana = Math.min(h.maxMana, h.mana + 3 + Math.floor(Math.random() * 3));
    updateHeroUI(h);
    spawnEnemyManaShards(h);
  });

  // Then each enemy that can attack does so once against a valid target
  const livingPlayers = heroes.filter(h => h.side === 'player' && !h.dead);
  if (livingPlayers.length === 0) {
    log('💀 All your units are down.');
    currentTurn = 'none';
    updateTurnUI();
    return;
  }

  // Starts after the mana shards' flight (~700ms including their stagger)
  // so the boosted hero's mana visibly arrives before anyone attacks.
  let delay = 700;
  livingEnemies.forEach(enemy => {
    if (enemy.mana < basicCostFor(enemy)) return;
    setTimeout(() => {
      if (enemy.dead || currentTurn !== 'enemy') return;
      const targets = getValidTargets(enemy);
      if (targets.length === 0) return;
      const target = targets[Math.floor(Math.random() * targets.length)];
      const useSpecial = enemy.isSpecial && enemy.mana >= SPECIAL_COST;
      performAttack(enemy, target, useSpecial ? 'special' : 'basic');
    }, delay);
    delay += 500;
  });

  setTimeout(() => {
    if (currentTurn === 'none') return; // battle already ended mid-turn
    const playersAlive = heroes.filter(h => h.side === 'player' && !h.dead).length;
    if (playersAlive === 0) return; // defeat already logged by performAttack
    currentTurn = 'player';
    heroes.forEach(h => { h.actedThisTurn = false; });
    heroes.forEach(updateHeroUI);
    swapUsedThisTurn = false;
    setBoardLocked(false);
    log('—— Your turn ——');
    updateTurnUI();
  }, delay + 200);
}

// ---------- BATTLE START / RESTART / REDEPLOY ----------
function startBattle() {
  if (placedCount() === 0) {
    log('Place at least one hero before starting.');
    return;
  }
  gamePhase = 'battle';
  setInfoText('battle');
  document.getElementById('deploy-panel').style.display = 'none';
  document.getElementById('board-wrap').style.display = 'block';
  document.getElementById('turn-indicator').style.display = 'block';
  document.getElementById('battle-controls').style.display = 'flex';
  document.getElementById('end-turn-wrap').style.display = 'block';
  document.getElementById('placement-controls').style.display = 'none';
  document.getElementById('filter-toggle-wrap').style.display = 'none';
  document.getElementById('deploy-filter-bar').style.display = 'none';

  buildArmies();
  endTileDrag();
  cancelAutoAttack();
  aimedTarget = null;
  pendingActionHero = null;
  isAnimating = false;
  currentTurn = 'player';
  swapUsedThisTurn = false;
  setBoardLocked(false);
  if (modal) modal.style.display = 'none';

  fillBoardNoMatches();
  renderBoard();
  pickRandomMapBackground();
  renderBattlefield();
  updateTurnUI();

  const teamList = heroes.filter(h => h.side === 'player').map(h => h.name).join(', ');
  log(`Battle start! Your team: ${teamList}`);
}

function restartBattle() {
  if (heroes.length === 0) { startBattle(); return; }
  heroes.forEach(h => { h.hp = h.maxHp; h.mana = 0; h.dead = false; h.actedThisTurn = false; });
  endTileDrag();
  cancelAutoAttack();
  aimedTarget = null;
  pendingActionHero = null;
  isAnimating = false;
  currentTurn = 'player';
  swapUsedThisTurn = false;
  setBoardLocked(false);
  if (modal) modal.style.display = 'none';
  fillBoardNoMatches();
  renderBoard();
  pickRandomMapBackground();
  renderBattlefield();
  updateTurnUI();
  log('Battle restarted — same team, fresh board.');
}

function goToDeployment() {
  heroes = [];
  initDeployment();
  log('Back to deployment — pick your team.');
}

document.getElementById('btn-start-battle').onclick = startBattle;
document.getElementById('btn-restart-battle').onclick = restartBattle;
document.getElementById('btn-redeploy').onclick = goToDeployment;

// ---------- INIT ----------
initDeployment();
</script>
