<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Match-3 Battlefield Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      padding-bottom: 40px;
      overflow-x: hidden;
    }
    h1 { font-size: 1.1rem; margin-bottom: 6px; color: #ffd700; }
    /* .info (the instructional blurb) and #log (the running message feed)
       are no longer shown on either screen, per direct request — kept in
       the DOM (just display:none) rather than removed outright, since
       log() writes to #log unconditionally on nearly every game action
       and has no null-guard; deleting the element would throw. */
    .info, #log { display: none; }
    .info {
      font-size: 0.72rem;
      color: #aaa;
      margin-bottom: 8px;
      text-align: center;
      max-width: 420px;
    }
    #log {
      width: 100%;
      max-width: 420px;
      height: 42px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.7rem;
      overflow-y: auto;
      margin-bottom: 8px;
      color: #8f8;
    }

    /* ===== BATTLEFIELD (shared by deployment + battle) ===== */
    /* Ranged always shows TEAM_CAP fixed slots (filled or empty); Melee is a
       free-form dynamic-length column. They are independent columns of
       standard-size cards — they no longer need to be pixel-aligned to each
       other, since lane/coverage is tracked in data, not visual row-matching. */
    #battlefield {
      display: flex;
      justify-content: space-between;
      /* stretch (not flex-start): all 4 columns match the tallest column's
         height. This matters functionally, not just visually — the Melee
         drop zone IS the .bf-column element, and with flex-start it was only
         ever as tall as its own current content (one card, or the empty
         placeholder). With 0-1 Melee placed that gave a tiny droppable area:
         dropping anywhere below it registered as "outside the zone" and got
         cancelled, which is why it looked like there was only one spot to
         place a Melee card. Stretching ties every column's droppable/visible
         height to the Ranged column's fixed 5-slot height instead. */
      align-items: stretch;
      gap: 4px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 10px;
      background-color: #16213e; /* shows during deployment, before any battle has picked a map */
      background-size: cover;
      background-position: center;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #0f3460;
    }
    /* Deployment-only, once the enemy section is removed from that screen:
       caps the box to roughly half its normal width so the two remaining
       player columns' cards stay close to their original size instead of
       stretching to fill the full 420px row. The parent body's flex
       `align-items: center` already centers a narrower block horizontally
       on its own, no extra margin needed. */
    #battlefield.deploy-battlefield-narrow {
      max-width: 220px;
    }
    .bf-column {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 0;
      min-width: 0;
    }
    .bf-column.center-content {
      justify-content: center;
    }
    .bf-column-label {
      font-size: 0.65rem;
      text-align: center;
      font-weight: bold;
      padding-bottom: 2px;
      white-space: nowrap;
    }
    .card {
      /* Standard card size — same for Ranged and Melee. A placeholder for a
         future 2D character sprite; keep this a simple, swappable unit.
         Height is 78px (not a round 66px) because a live Melee card's full
         stack of content — icon, name, HP, mana bar, AND a coverage tag —
         measures ~74px naturally; at the old 66px, flexbox's default
         min-height:0-on-overflow:hidden-children behavior crushed .card-name
         down to ~2px (invisible) to make everything else fit, since
         .mana-bar-bg is the only child protected with flex-shrink:0. 78px
         gives every child room to render at its natural size with a small
         buffer, on both Ranged (no coverage tag, previously fine) and
         Melee (previously broken) cards alike. */
      width: 100%;
      height: 78px;
      border-radius: 8px;
      background: #2a2a4a;
      border: 2px solid #555;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 2px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, box-shadow 0.15s;
      user-select: none;
      -webkit-touch-callout: none; /* iOS: suppress the long-press text-selection/callout menu on a draggable card */
      overflow: hidden;
      flex-shrink: 0;
    }
    .card:active { transform: scale(0.95); }
    .card.selected {
      box-shadow: 0 0 0 3px #00ffaa, 0 0 12px #00ffaa88;
      transform: scale(1.05);
      z-index: 5;
    }
    .card.dead {
      opacity: 0.25;
      filter: grayscale(1);
      pointer-events: none;
    }
    .card.acted {
      opacity: 0.5;
      filter: grayscale(0.7);
    }
    .card.special {
      border-color: #c0c0c0;
      box-shadow: 0 0 6px #c0c0c088;
    }
    .card.special.selected {
      box-shadow: 0 0 0 3px #00ffaa, 0 0 14px #c0c0c0;
    }
    /* "Glowing" = this player hero can act right now (tap it to attack the
       Logical Target). Distinct gold pulse so it reads as "tap me", not
       confused with .selected's green glow (which now marks the enemy the
       player has pre-aimed at, not a lingering "hero picked" state). */
    @keyframes canActPulse {
      0%, 100% { box-shadow: 0 0 6px #ffd700aa; }
      50% { box-shadow: 0 0 14px #ffd700; }
    }
    .card.can-act {
      border-color: #ffd700;
      animation: canActPulse 1.4s ease-in-out infinite;
    }
    .card.empty-slot {
      background: #1a1a2e;
      border: 2px dashed #444;
      cursor: pointer;
    }
    .card.empty-slot.not-clickable { cursor: default; }
    /* An unfilled Ranged slot during live battle: it still occupies its row
       (so filled slots below it don't shift, and Ranged rects stay accurate
       for Melee band-positioning) but shouldn't visibly read as a droppable
       "empty slot" anymore — nothing is draggable once battle has started.
       visibility:hidden (not display:none) is what preserves the layout
       footprint while hiding the box itself. */
    .card.battle-empty-slot {
      visibility: hidden;
    }
    .card-icon { font-size: 1.05rem; line-height: 1; margin-top: 1px; flex-shrink: 0; }
    /* Character pose art (Idle by default, briefly swapped to Attack/Impacted
       — see triggerHeroPose()) is applied as a CSS background-image on the
       card itself (heroArtBackground(), set inline via JS) rather than an
       <img> child — backgrounds always paint below all of an element's own
       content, guaranteed by the spec, with none of the stacking-context
       pitfalls a positioned/negative-z-index child image ran into (a plain
       position:relative element with no explicit z-index doesn't actually
       establish its own stacking context, so that child's negative z-index
       silently escaped past the card and rendered behind unrelated page
       content instead of just this card's own background). */
    .card-name {
      /* flex-shrink:0 matters here specifically: this element also has
         overflow:hidden (for the ellipsis), and a flex child with overflow
         other than visible gets its automatic min-height reset to 0 — so
         without an explicit flex-shrink:0, THIS is the element the flexbox
         algorithm reaches for first when a card's content is taller than
         its box, shrinking the name toward invisible before touching
         anything else. See the .card height comment for the full story. */
      font-size: 0.55rem;
      line-height: 1.15;
      color: #eee;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font-weight: 600;
      flex-shrink: 0;
      text-shadow: 0 1px 2px #000, 0 0 4px #000; /* legible over busy character art now sitting behind it */
    }
    .card-color-dot {
      position: absolute;
      top: 3px; left: 3px;
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 1px solid #000;
    }
    /* Tap-to-place / tap-to-remove badge, upper-right corner of a card —
       the touch-friendly alternative to drag (see DECISIONS.md). No circle/
       background — just a bare glyph with a dark outline glow for legibility
       against the card's own color gradient. */
    .card-action-btn {
      position: absolute;
      top: 0; right: 2px;
      width: 22px; height: 22px;
      line-height: 22px;
      font-size: 1.15rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      z-index: 2;
      user-select: none;
      text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 1px #000;
    }
    .card-action-btn.add { color: #2ecc71; }
    .card-action-btn.remove { color: #e74c3c; }
    .mana-bar-bg {
      width: 92%;
      height: 12px;
      background: #0a0a12;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 1px;
      border: 1px solid #555;
      position: relative;
      flex-shrink: 0;
    }
    .mana-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00e5ff, #00a0ff);
      transition: width 0.35s ease-out;
      box-shadow: 0 0 8px #00e5ff;
    }
    .mana-num {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.58rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px #000, 0 0 4px #000;
      pointer-events: none;
      text-align: center;
    }
    .card.gained {
      animation: manaFlash 0.6s ease;
    }
    /* A Hero's mana bar glows once it's completely full (ready for
       Special) — Heroes only, since normal characters have no Special to
       build toward. Same gold as .can-act's pulse, for one consistent
       "this is ready" visual language across the card. */
    @keyframes manaFullPulse {
      0%, 100% { box-shadow: 0 0 8px #ffd700aa; }
      50% { box-shadow: 0 0 16px 3px #ffd700; }
    }
    .mana-bar.mana-full {
      animation: manaFullPulse 1.2s ease-in-out infinite;
    }
    @keyframes manaFlash {
      0% { box-shadow: 0 0 0 0 #00ffaa; }
      40% { box-shadow: 0 0 20px 6px #00ffaa; transform: scale(1.08); }
      100% { box-shadow: none; transform: scale(1); }
    }
    /* Matched tiles fly to the mana bar of every living player hero of
       that color as tiny glittering shards — see spawnManaShards(). Fixed
       positioning + a left/top transition is simplest here since each
       shard's start/end points are literal viewport coordinates read from
       two unrelated elements (a board tile, a hero's mana bar). */
    #shard-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 500;
    }
    .mana-shard {
      position: fixed;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      transform: rotate(45deg);
      box-shadow: 0 0 6px currentColor, 0 0 2px #fff;
      transition: left 0.5s cubic-bezier(0.25,0.4,0.35,1), top 0.5s cubic-bezier(0.25,0.4,0.35,1),
                  opacity 0.5s ease, transform 0.5s ease;
    }
    .hp-text {
      font-size: 0.62rem;
      line-height: 1;
      color: #f88;
      font-weight: bold;
      flex-shrink: 0;
    }
    /* Live battle cards only (see buildHeroCardEl) — a real depleting bar
       instead of plain "7/7" text, same structure as .mana-bar-bg with the
       number kept visible as an overlay. Deployment preview cards keep the
       old plain .hp-text (always full pre-battle, a bar adds nothing there). */
    .hp-bar-bg {
      width: 92%;
      height: 10px;
      background: #0a0a12;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 1px;
      border: 1px solid #555;
      position: relative;
      flex-shrink: 0;
    }
    .hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff5f5f, #d32f2f);
      transition: width 0.35s ease-out;
    }
    .hp-num {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.5rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px #000, 0 0 4px #000;
      pointer-events: none;
      text-align: center;
    }
    .card.player .mana-bar { background: linear-gradient(90deg, #00c6ff, #0072ff); }
    .card.enemy .mana-bar { background: linear-gradient(90deg, #f5576c, #f093fb); }

    /* Color accents on cards */
    .card[data-color="red"]    { background: linear-gradient(160deg, #4a2020, #2a2a4a); }
    .card[data-color="green"]  { background: linear-gradient(160deg, #1a3a1a, #2a2a4a); }
    .card[data-color="blue"]   { background: linear-gradient(160deg, #1a2a4a, #2a2a4a); }
    .card[data-color="yellow"] { background: linear-gradient(160deg, #4a3a10, #2a2a4a); }
    .card[data-color="purple"] { background: linear-gradient(160deg, #3a1a4a, #2a2a4a); }

    /* ===== DEPLOYMENT PANEL ===== */
    #deploy-panel { width: 100%; max-width: 420px; }
    #deploy-status {
      font-size: 0.72rem;
      color: #ccc;
      text-align: center;
      white-space: nowrap;
    }
    #deploy-roster-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
      padding: 6px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      margin-bottom: 10px;
      justify-content: center;
    }
    .roster-mini-card {
      width: 92px;
      background: #22223a;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }
    .roster-mini-card.selected {
      border-color: #00ffaa;
      box-shadow: 0 0 8px #00ffaa88;
    }
    .roster-mini-card[data-color="red"]    { background: linear-gradient(160deg, #3a1e1e, #22223a 70%); }
    .roster-mini-card[data-color="green"]  { background: linear-gradient(160deg, #1a331a, #22223a 70%); }
    .roster-mini-card[data-color="blue"]   { background: linear-gradient(160deg, #1a2740, #22223a 70%); }
    .roster-mini-card[data-color="yellow"] { background: linear-gradient(160deg, #3a3010, #22223a 70%); }
    .roster-mini-card[data-color="purple"] { background: linear-gradient(160deg, #331a3a, #22223a 70%); }
    .mini-color-dot { width: 10px; height: 10px; border-radius: 50%; margin: 0 auto 3px; border: 1px solid #000; }
    .mini-name { font-size: 0.58rem; font-weight: bold; color: #fff; line-height: 1.15; margin-bottom: 2px; }
    .mini-sub { font-size: 0.5rem; color: #aaa; }

    #deploy-filter-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .filter-chip-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-chip {
      background: #2a2a4a;
      border: 1px solid #555;
      color: #ccc;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 0.7rem;
      cursor: pointer;
      user-select: none;
    }
    .filter-chip.active {
      background: #ffd700;
      color: #1a1a2e;
      border-color: #ffd700;
      font-weight: bold;
    }
    .filter-chip.clear-chip {
      background: #333;
      color: #ddd;
    }
    /* Clear stays visually inert until a filter is actually applied — per
       direct instruction — since clicking it with nothing active would be
       a no-op anyway. pointer-events:none blocks the click outright rather
       than relying on a JS guard in the handler. */
    .filter-chip.clear-chip.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .filter-chip.colors-toggle.active {
      background: #2a2a4a;
      color: #ccc;
      border-color: #ffd700;
      font-weight: normal;
    }
    .filter-color-chip {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #555;
      cursor: pointer;
    }
    .filter-color-chip.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px #ffd700;
    }

    /* ===== MELEE DRAG-TO-PLACE ===== */
    /* The ghost is a real .card element (see buildGhost) so it looks
       identical to the placed/roster card it came from — this class only
       adds the positioning/floating mechanics on top, it doesn't restyle
       the card look itself (that all comes from .card + its own modifiers,
       e.g. .special, [data-color]). */
    .drag-ghost {
      position: fixed;
      z-index: 200;
      pointer-events: none;
      width: 95px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      opacity: 0.95;
    }
    .card.guard-preview {
      box-shadow: 0 0 0 3px #00ffaa, 0 0 14px #00ffaa;
    }
    .card.drop-target-hover {
      box-shadow: 0 0 0 3px #ffd700, 0 0 14px #ffd70088;
      border-color: #ffd700;
    }
    .coverage-tag {
      font-size: 0.46rem;
      color: #9be;
      line-height: 1;
      flex-shrink: 0;
    }
    /* .dropzone-hint no longer draws its own outline (the outer dashed box
       that used to wrap the whole Melee column, one level up from each
       individual empty-slot card's own dashed border, was removed per
       direct request — the individual "tap + to place" cards' dashed
       borders, below, are the only dashed lining left). The class name is
       kept as a marker purely to scope the sizing rule below to deployment
       specifically (not live battle — see renderBattlefield). */
    /* With #battlefield's columns now stretched to equal height, make the
       Melee dropzone's "drag here" placeholder fill that whole height (not
       just one 78px card) so the entire droppable area visually reads as
       such, instead of a small box sitting above a mysterious empty gap. */
    .bf-column.dropzone-hint .card.empty-slot {
      flex: 1 1 auto;
      height: auto;
      min-height: 78px;
    }
    /* Containing block for the absolutely-positioned, row-snapped Melee
       cards — needed in both deployment (alongside .dropzone-hint above)
       and live battle (on its own, once the dashed hint is gone). */
    .bf-column.melee-positioned {
      position: relative;
    }
    /* A simple, permanent divider between the player's two columns and the
       enemy's two columns — present in both deployment and battle. Dotted
       (not the dashed style used above) so it doesn't read as another
       drop-target hint, just a plain "your side / their side" separator. */
    .bf-column.side-divider {
      border-left: 2px dotted #778;
      padding-left: 6px;
    }

    /* ===== MATCH-3 BOARD ===== */
    #board-wrap {
      width: 100%;
      max-width: 420px;
      background: #0f3460;
      border-radius: 10px;
      padding: 8px;
      border: 2px solid #e94560;
      transition: opacity 0.25s;
    }
    #board-wrap.locked {
      opacity: 0.5;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(5, 48px);
      gap: 3px;
    }
    .tile {
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.25s, background 0.2s;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: bold;
      color: rgba(0,0,0,0.35);
      user-select: none;
      /* Tap-hold-and-drag-to-swap needs the browser to never intercept the
         gesture as a native scroll/selection — every touch that starts on
         a tile is a game gesture, not a page scroll. */
      touch-action: none;
      -webkit-touch-callout: none;
    }
    .tile.empty {
      background: #1a1a2e;
      border: 1px dashed #333;
      cursor: default;
      opacity: 0.4;
    }
    .tile.selected {
      border-color: #fff;
      transform: scale(1.08);
      z-index: 2;
      box-shadow: 0 0 10px #fff8;
    }
    .tile.red    { background: #e74c3c; }
    .tile.green  { background: #2ecc71; }
    .tile.blue   { background: #3498db; }
    .tile.yellow { background: #f1c40f; }
    .tile.purple { background: #9b59b6; }
    .tile.matching {
      transform: scale(0.85);
      opacity: 0.5;
      box-shadow: 0 0 12px #fff;
    }
    .tile.special-bomb {
      box-shadow: 0 0 0 2px #ff8c00, inset 0 0 10px rgba(0,0,0,0.5);
      font-size: 1rem;
    }
    .tile.special-crystal {
      box-shadow: 0 0 0 2px #e0d0ff, inset 0 0 10px rgba(255,255,255,0.4);
      font-size: 1rem;
    }

    .controls {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    button:active { background: #c81e45; }
    button:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }

    /* ===== Battle screen controls row (Auto Attack far left, End Turn centered) ===== */
    /* Absolute positioning, not flex/grid: End Turn must stay pixel-centered
       on the row regardless of Auto Attack's own width — and that width
       genuinely changes (its label toggles between "OFF"/"ON", different
       lengths), which would throw off any flex/grid trick that balances
       the two based on a snapshot of Auto Attack's current size. Anchoring
       End Turn to the row's own 50% is independent of that entirely. */
    #battle-controls-row {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      min-height: 34px;
    }
    #btn-auto-attack {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      background: #16537e;
      color: #9be3ff;
      border: 2px solid #4facfe;
      border-radius: 14px;
      padding: 6px 10px;
      font-size: 0.65rem;
      font-weight: bold;
      white-space: nowrap;
    }
    #btn-auto-attack.on {
      background: #4facfe;
      color: #0a1a2a;
    }
    #btn-end-turn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #27ae60;
      white-space: nowrap;
    }

    /* ===== Placement screen controls (Formation / Deployed count / Codex, then Filter below) ===== */
    /* Sits just outside the placement box, not overlapping its cards: two
       rows of their own directly underneath, each centered as a group.
       Row order is fixed per direct request: Formation, count, Codex —
       then Filter alone on the row below. */
    #placement-controls {
      width: 100%;
      max-width: 300px; /* widened from 220px to fit the new info bubble trigger without the row overflowing/centering-shifting */
      margin: 6px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

<script src="characters.js"></script>
<script>
// BASIC_COST, BASIC_DMG, SPECIAL_COST, SPECIAL_DMG, maxManaFor, CHARACTERS all come from characters.js.

const COLORS = ['red', 'green', 'blue', 'yellow', 'purple'];
const COLOR_HEX = { red: '#e74c3c', green: '#2ecc71', blue: '#3498db', yellow: '#f1c40f', purple: '#9b59b6' };
const COLS = 7;
const ROWS = 5;

// ---------- BATTLEFIELD LAYOUT ----------
// Team composition is fully flexible: each side fields at most TEAM_CAP
// characters total (any mix of Ranged/Melee), not fixed slot counts.
//
// Both zones are placed by drag-and-drop, dragged out of the roster list:
//   - Ranged has TEAM_CAP fixed, always-visible slots (a small grid the
//     player picks from) — drop a Ranged hero on any empty slot to claim it,
//     in whatever order the player likes. Dragging a placed Ranged hero lets
//     the player move it to another empty slot, or drag it off the
//     battlefield to remove it.
//   - Melee has no fixed slots at all — it's a free vertical drop zone.
//     While dragging a Melee hero up/down inside it, the Ranged slot(s) it
//     would protect at the current pointer position light up live, computed
//     purely from where the Ranged cards currently sit on screen.
//
// A Melee hero's on-screen ROW is independent from what it actually
// PROTECTS — these used to be conflated (which caused two failed fix
// attempts) and are now deliberately two separate things:
//   - `band` is pure geometry: which Ranged slot it's level with, or the
//     half-step gap between two adjacent Ranged slots it's straddling.
//     { type: 'aligned', index: i }        — level with Ranged slot i
//     { type: 'boundary', indices: [i, j] } — half-step, straddling slots i/j
//     This is computed from the FIXED Ranged slot grid (RANGED_SLOTS always
//     renders, filled or not), so it's always resolvable — placing a Melee
//     hero next to a still-empty Ranged slot is fine.
//   - `coverage` is what that position actually protects RIGHT NOW, derived
//     from `band` plus which Ranged slots happen to be filled at the moment
//     (see resolveMeleeCoverage): a boundary only protects both neighbors if
//     BOTH are filled ("as long as both ranged are together"); if only one
//     side has a Ranged hero, it just guards that one; if neither does, it
//     guards nothing yet. Same shape as before: { type: 'aligned', lane } /
//     { type: 'boundary', lanes: [i,j] } / null.
// Coverage is binary — "partial" and "full" protection both fully block
// opposing Melee from reaching that Ranged unit; no damage-reduction gradient.
const TEAM_CAP = 5; // max characters per side, Ranged + Melee combined
const RANGED_SLOTS = TEAM_CAP; // Ranged column always shows this many fixed slots

// The enemy roster is randomized fresh every time the player (re)enters
// deployment (see randomizeEnemyTeam() below and its call in
// initDeployment()) rather than fixed. `let` (not `const`) because
// randomizeEnemyTeam() reassigns this. The shape is always TEAM_CAP total,
// but the Ranged/Melee split itself is now also randomized — see
// ENEMY_FORMATIONS below; the placeholder value here only matters until the
// first randomizeEnemyTeam() call, which always runs before this is ever
// read (initDeployment calls it before any rendering or battle setup).
let ENEMY_TEAM = {
  ranged: ['lumi', 'saryn'], // lanes 0, 1
  melee: [
    { charId: 'korr', coverage: { type: 'aligned', lane: 0 } },
    { charId: 'rorik', coverage: { type: 'boundary', lanes: [0, 1] } },
    { charId: 'brick', coverage: { type: 'aligned', lane: 1 } }
  ]
};

// Two possible enemy formation shapes, picked with equal probability each
// time deployment is (re)entered (see randomizeEnemyTeam()). Each always
// totals TEAM_CAP (5) — only how it splits between Ranged and Melee, and how
// the Melee cover the Ranged lanes, differs:
//  - 3 Melee / 2 Ranged: the original static team's lane pattern (one Melee
//    aligned to each lane, one straddling the boundary between them).
//  - 2 Melee / 3 Ranged: two boundary guards side by side, each covering an
//    adjacent pair of lanes (0/1 and 1/2) — together they cover all 3 lanes
//    (lane 1 doubly so) with only 2 Melee.
const ENEMY_FORMATIONS = [
  {
    rangedCount: 2,
    meleeBands: [
      { type: 'aligned', lane: 0 },
      { type: 'boundary', lanes: [0, 1] },
      { type: 'aligned', lane: 1 }
    ]
  },
  {
    rangedCount: 3,
    meleeBands: [
      { type: 'boundary', lanes: [0, 1] },
      { type: 'boundary', lanes: [1, 2] }
    ]
  }
];

// Six practical, ready-made unit-placement layouts for the PLAYER's own
// Ranged/Melee columns, offered from the Formations button on the
// deployment screen (see applyFormationPreset() below). Unlike
// ENEMY_FORMATIONS above, these use real RANGED_SLOTS row indices (0..4,
// the player's actual fixed grid) and every melee band here is verified
// bandsConflict()-safe — the enemy's simpler "lane" formations above don't
// need that check since the enemy is rendered as a plain list, not
// pixel-aligned to real overlapping rows the way the player's is. Each
// entry deliberately showcases a different practical use of the
// aligned/boundary staggered-coverage mechanic (see GAME_MECHANICS.md).
const FORMATION_PRESETS = [
  {
    name: 'Twin Wall',
    blurb: 'Two staggered guards lock down three ranged lanes — maximum coverage per melee.',
    ranged: [0, 1, 2],
    melee: [{ type: 'boundary', indices: [0, 1] }, { type: 'boundary', indices: [1, 2] }]
  },
  {
    name: 'Spearhead',
    blurb: 'One protected striker behind a wall of four blades.',
    ranged: [2],
    melee: [
      { type: 'aligned', index: 0 }, { type: 'aligned', index: 1 },
      { type: 'aligned', index: 2 }, { type: 'aligned', index: 3 }
    ]
  },
  {
    name: 'Checkerboard',
    blurb: 'Spread ranged lanes, partial cover — one flank is left exposed.',
    ranged: [0, 2, 4],
    melee: [{ type: 'aligned', index: 0 }, { type: 'aligned', index: 2 }]
  },
  {
    name: 'Bottleneck',
    blurb: 'A wide ranged line funnels through a single choke point.',
    ranged: [0, 1, 2, 3],
    melee: [{ type: 'boundary', indices: [1, 2] }]
  },
  {
    name: 'Vanguard Brawl',
    blurb: 'One guard locks down the back line; extra blades push the front.',
    ranged: [1, 2],
    melee: [
      { type: 'boundary', indices: [1, 2] },
      { type: 'aligned', index: 3 }, { type: 'aligned', index: 4 }
    ]
  },
  {
    name: 'Solo Guard',
    blurb: 'The simplest pair: one protector, one protected — a foundation to build on.',
    ranged: [2],
    melee: [{ type: 'aligned', index: 2 }]
  }
];

function charById(id) { return CHARACTERS.find(c => c.id === id); }

// ---------- ENEMY TEAM RANDOMIZATION ----------
// Design constraints (see DECISIONS.md): the enemy team must always show at
// least 4 distinct colors among its 5 characters (out of 5 possible match-3
// colors, so at most one same-color pair), and at most 2 of the 5 may be
// Heroes (isSpecial) — i.e. at least 3 must be plain non-hero troops.
function shuffledCopy(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickN(pool, n) { return shuffledCopy(pool).slice(0, n); }
function randomIntUpTo(maxInclusive) { return Math.floor(Math.random() * (maxInclusive + 1)); }

// Builds one candidate { rangedIds, meleeIds } draw for the given split. The
// hero cap (<=2 of 5) is enforced BY CONSTRUCTION, not by rejecting random
// draws and hoping — with 32 of 45 characters being Heroes, a fully-random
// 5-character draw would satisfy "at most 2 Heroes" only rarely, so this
// explicitly decides how many Heroes/non-Heroes go into each role before
// picking specific characters from the matching type+specialty bucket.
// rangedCount/meleeCount come from the chosen ENEMY_FORMATIONS entry and
// always sum to TEAM_CAP; both are always >= MAX_HEROES, so rangedHeroCount/
// meleeHeroCount (each capped at MAX_HEROES by construction) never exceed
// the role's own count.
function drawEnemyRoster(buckets, rangedCount, meleeCount) {
  const MAX_HEROES = 2;
  const heroCount = randomIntUpTo(MAX_HEROES); // 0, 1, or 2 Heroes total this draw
  const rangedHeroCount = randomIntUpTo(heroCount); // rest of heroCount goes to Melee
  const meleeHeroCount = heroCount - rangedHeroCount;
  const rangedIds = shuffledCopy([
    ...pickN(buckets.rangedHero, rangedHeroCount),
    ...pickN(buckets.rangedNonHero, rangedCount - rangedHeroCount)
  ]);
  const meleeIds = shuffledCopy([
    ...pickN(buckets.meleeHero, meleeHeroCount),
    ...pickN(buckets.meleeNonHero, meleeCount - meleeHeroCount)
  ]);
  return { rangedIds, meleeIds };
}

function buildRandomEnemyRoster(rangedCount, meleeCount) {
  const MIN_COLORS = 4;
  const buckets = { rangedHero: [], rangedNonHero: [], meleeHero: [], meleeNonHero: [] };
  CHARACTERS.forEach(c => {
    const key = (c.type === 'ranged' ? 'ranged' : 'melee') + (c.isSpecial ? 'Hero' : 'NonHero');
    buckets[key].push(c.id);
  });
  // The hero cap is already guaranteed by drawEnemyRoster's construction;
  // this loop only retries for color diversity, a much friendlier
  // probability, so a handful of attempts is always enough in practice —
  // the hard cap below is just a safety net against a pathological miss.
  let draw = null;
  for (let attempt = 0; attempt < 50; attempt++) {
    const candidate = drawEnemyRoster(buckets, rangedCount, meleeCount);
    const colorCount = new Set([...candidate.rangedIds, ...candidate.meleeIds].map(id => charById(id).color)).size;
    if (colorCount >= MIN_COLORS) { draw = candidate; break; }
  }
  return draw || drawEnemyRoster(buckets, rangedCount, meleeCount); // fallback: hero cap still holds even if color target is missed
}

// Picks one of ENEMY_FORMATIONS at random, then draws characters into it.
function randomizeEnemyTeam() {
  const formation = ENEMY_FORMATIONS[Math.floor(Math.random() * ENEMY_FORMATIONS.length)];
  const meleeCount = formation.meleeBands.length;
  const { rangedIds, meleeIds } = buildRandomEnemyRoster(formation.rangedCount, meleeCount);
  ENEMY_TEAM = {
    ranged: rangedIds,
    melee: meleeIds.map((charId, i) => ({ charId, coverage: formation.meleeBands[i] }))
  };
}
// basicCostFor / basicDmgFor / maxManaFor come from characters.js — shared
// with Roster.html so both screens agree on a character's actual attack cost.
function primaryLane(coverage) {
  if (!coverage) return 99; // uncovered melee sorts to the end
  return coverage.type === 'aligned' ? coverage.lane : coverage.lanes[0];
}
function coverageLabel(coverage) {
  if (!coverage) return '🛡 none';
  if (coverage.type === 'aligned') return `🛡 R${coverage.lane + 1}`;
  return `🛡 R${coverage.lanes[0] + 1}+R${coverage.lanes[1] + 1}`;
}

// ---------- BATTLE ART ASSETS ----------
// Pixel-art battlefield backgrounds and character pose sets, added directly
// to the repo under /Artwork (not generated). There are only a handful of
// finished character skins (3 Ranged, 4 Melee) versus 45 named roster
// characters, so per direct instruction any deployed character just gets
// assigned one of these skins by type by (see assignHeroArt()) rather than
// needing 1:1 matching art — "if they select more than three of either
// type, use a copy of that same type" (the pool naturally repeats via `%`
// once a side has more of that type deployed than the pool has entries).
const RANGED_SKINS = [
  { idle: 'Artwork/Characters/Female Archer/Idle Bow-woman.png', attack: 'Artwork/Characters/Female Archer/Attacking Bow-woman.png', impacted: 'Artwork/Characters/Female Archer/Impacted Bow-woman.png' },
  { idle: 'Artwork/Characters/Male Armored Bowman/Male Idle Armored Bowman.png', attack: 'Artwork/Characters/Male Armored Bowman/Male Armored Bowman.png', impacted: 'Artwork/Characters/Male Armored Bowman/Male Impacted Bowman.png' },
  { idle: 'Artwork/Characters/Male Heavy Bowman/Idle Male Heavy Bowman.png', attack: 'Artwork/Characters/Male Heavy Bowman/Male Heavy Bowman.png', impacted: 'Artwork/Characters/Male Heavy Bowman/Impacted Male Heavy Bowman.png' }
];
const MELEE_SKINS = [
  { idle: 'Artwork/Characters/Male Armored Spearman/Idle Armored Spearman.png', attack: 'Artwork/Characters/Male Armored Spearman/Attacking Armored Spearman.png', impacted: 'Artwork/Characters/Male Armored Spearman/Impacted Armored Spearman.png' },
