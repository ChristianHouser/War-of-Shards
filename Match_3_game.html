// newly-spawned special toward the cell the player's own swap landed on.
// `activationSeeds` ([{x,y,color,type}], optional) are special tiles the
// player deliberately activated without necessarily forming a new match —
// an Arcane Bomb via a swap that touches it, or a Runic Crystal via a
// direct tap — see onTileClick — resolved through the same explosion-queue
// machinery.
function processMatches(swapHint, activationSeeds) {
  const groups = findMatchGroups();
  if (groups.length === 0 && (!activationSeeds || activationSeeds.length === 0)) {
    isAnimating = false;
    selectedTile = null;
    checkAutoEndPlayerTurn();
    return;
  }

  const preExisting = boardSpecial.map(row => row.slice());
  const toClear = new Set();
  const spawns = [];
  const explosionQueue = [];
  const queuedKeys = new Set();
  const logParts = [];

  function queueExplosionIfSpecial(x, y) {
    const type = preExisting[y][x];
    if (!type) return;
    // Runic Crystals no longer auto-activate by being incidentally caught in
    // a fresh match — only a direct tap on the crystal (see onTileClick)
    // opens its choice modal. Caught-in-a-match crystals just clear like any
    // other matched tile (still paying their share of the group's mana).
    // Arcane Bombs are unaffected — being matched still detonates them.
    if (type !== 'bomb') return;
    const k = `${x},${y}`;
    if (queuedKeys.has(k)) return;
    queuedKeys.add(k);
    explosionQueue.push({x, y, color: board[y][x], type});
  }

  (activationSeeds || []).forEach(seed => {
    const k = `${seed.x},${seed.y}`;
    if (queuedKeys.has(k)) return;
    queuedKeys.add(k);
    explosionQueue.push(seed);
  });

  groups.forEach(group => {
    const spawnType = group.cells.length >= 5 ? 'crystal' : group.cells.length === 4 ? 'bomb' : null;
    const spawnCell = spawnType ? pickSpawnCell(group, swapHint) : null;
    group.cells.forEach(c => {
      if (spawnCell && c.x === spawnCell.x && c.y === spawnCell.y) {
        queueExplosionIfSpecial(c.x, c.y); // overwriting a pre-existing special still "matches" it
        return;
      }
      toClear.add(`${c.x},${c.y}`);
      queueExplosionIfSpecial(c.x, c.y);
    });
    if (spawnCell) spawns.push({x: spawnCell.x, y: spawnCell.y, color: group.color, type: spawnType});
    const gain = group.cells.length; // 1 mana per tile, every tier
    const grantedTo = grantMana(group.color, gain);
    logParts.push(`${group.color} +${gain}${spawnCell ? ` (spawns ${spawnType === 'crystal' ? 'Runic Crystal' : 'Arcane Bomb'})` : ''}${grantedTo === 0 ? ' (no hero of this color)' : ''}`);
  });
  if (logParts.length > 0) log(`Match! ${logParts.join(' | ')}`);

  processExplosionQueue(explosionQueue, 0, toClear, queuedKeys, logParts, () => {
    toClear.forEach(k => {
      const [cx, cy] = k.split(',').map(Number);
      board[cy][cx] = null;
      boardSpecial[cy][cx] = null;
    });
    spawns.forEach(s => {
      if (toClear.has(`${s.x},${s.y}`)) return; // consumed by an explosion before it could spawn
      board[s.y][s.x] = s.color;
      boardSpecial[s.y][s.x] = s.type;
    });
    renderBoard();

    setTimeout(() => {
      applyGravityAndFill();
      renderBoard();

      setTimeout(() => {
        const again = findMatchedCells();
        if (again.hasMatches) {
          processMatches(); // cascades never carry a swap hint or activation seed
        } else {
          isAnimating = false;
          selectedTile = null;
          checkAutoEndPlayerTurn();
        }
      }, 220);
    }, 280);
  });
}

function onTileClick(x, y) {
  if (gamePhase !== 'battle' || isAnimating || currentTurn !== 'player') return;
  if (swapUsedThisTurn) {
    log('You already used this turn\'s one board action (swap or crystal tap) — attack with anyone who can, then the turn ends.');
    return;
  }
  if (selectedHero) {
    selectedHero = null;
    heroes.forEach(updateHeroUI);
  }

  // Ignore clicks on empty tiles
  if (!board[y][x]) return;

  // Runic Crystal: a direct tap activates it immediately (opens the choice
  // modal) instead of joining the normal select-then-swap flow — the
  // crystal's options must not appear until the player deliberately taps it
  // (not from being incidentally caught in a later match, and not from an
  // unrelated swap merely touching it — see queueExplosionIfSpecial and the
  // swap branch below). A crystal's own cell can never be used as one half
  // of a normal two-tile swap once it exists on the board. Counts as this
  // turn's one board action, same as a normal swap.
  if (boardSpecial[y][x] === 'crystal') {
    if (selectedTile) {
      const prevEl = getTileEl(selectedTile.x, selectedTile.y);
      if (prevEl) prevEl.classList.remove('selected');
      selectedTile = null;
    }
    const el = getTileEl(x, y);
    if (el) el.classList.add('selected');
    isAnimating = true;
    swapUsedThisTurn = true;
    setBoardLocked(true);
    setTimeout(() => {
      if (el) el.classList.remove('selected');
      processMatches(null, [{x, y, color: board[y][x], type: 'crystal'}]);
    }, 120);
    return;
  }

  if (!selectedTile) {
    selectedTile = {x, y};
    const el = getTileEl(x, y);
    if (el) el.classList.add('selected');
    return;
  }

  // second click
  const x1 = selectedTile.x, y1 = selectedTile.y;
  const prevEl = getTileEl(x1, y1);
  if (prevEl) prevEl.classList.remove('selected');

  // adjacent?
  const dx = Math.abs(x - x1), dy = Math.abs(y - y1);
  if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
    // swap (color AND special status move together)
    const tmpColor = board[y1][x1], tmpSpecial = boardSpecial[y1][x1];
    board[y1][x1] = board[y][x];
    boardSpecial[y1][x1] = boardSpecial[y][x];
    board[y][x] = tmpColor;
    boardSpecial[y][x] = tmpSpecial;
    renderBoard();

    // A swap that touches an Arcane Bomb is always allowed — that's what
    // "activated" (as opposed to "matched") means for a bomb, a deliberate
    // detonation even without forming a new color-match — in addition to the
    // normal "did this create a match" check. Runic Crystals are excluded
    // here (and can't be, since a crystal tile is intercepted above before
    // ever reaching this swap logic) — a crystal only ever activates via a
    // direct tap.
    const {hasMatches} = findMatchedCells();
    const activationSeeds = [];
    if (boardSpecial[y1][x1] === 'bomb') activationSeeds.push({x: x1, y: y1, color: board[y1][x1], type: 'bomb'});
    if (boardSpecial[y][x] === 'bomb') activationSeeds.push({x, y, color: board[y][x], type: 'bomb'});

    if (hasMatches || activationSeeds.length > 0) {
      isAnimating = true;
      selectedTile = null;
      swapUsedThisTurn = true; // a turn only gets one swap
      setBoardLocked(true);
      const swapHint = [{x: x1, y: y1}, {x, y}];
      setTimeout(() => processMatches(swapHint, activationSeeds), 120);
    } else {
      // revert
      board[y][x] = board[y1][x1];
      boardSpecial[y][x] = boardSpecial[y1][x1];
      board[y1][x1] = tmpColor;
      boardSpecial[y1][x1] = tmpSpecial;
      renderBoard();
      log('No match – swap reverted');
      selectedTile = null;
    }
  } else {
    // not adjacent – select the new one
    selectedTile = {x, y};
    const el = getTileEl(x, y);
    if (el) el.classList.add('selected');
  }
}

// ---------- COMBAT ----------
const modal = document.getElementById('attack-modal');
const modalTitle = document.getElementById('modal-title');
const btnBasic = document.getElementById('btn-basic');
const btnSpecial = document.getElementById('btn-special');
const btnDoNothing = document.getElementById('btn-donothing');
const btnCancel = document.getElementById('btn-cancel');

btnBasic.onclick = () => {
  if (!pendingActionHero) return;
  const cost = basicCostFor(pendingActionHero);
  if (pendingActionHero.mana < cost) {
    log(`Not enough mana for Basic (need ${cost}).`);
    return;
  }
  selectedHero = pendingActionHero;
  selectedAttackType = 'basic';
  pendingActionHero = null;
  modal.style.display = 'none';
  heroes.forEach(updateHeroUI);
  log(`Selected ${selectedHero.name} — BASIC. Tap an enemy.`);
};

btnSpecial.onclick = () => {
  if (!pendingActionHero) return;
  if (pendingActionHero.mana < SPECIAL_COST) {
    log('Not enough mana for Special (need 5).');
    return;
  }
  selectedHero = pendingActionHero;
  selectedAttackType = 'special';
  pendingActionHero = null;
  modal.style.display = 'none';
  heroes.forEach(updateHeroUI);
  log(`Selected ${selectedHero.name} — SPECIAL ★. Tap an enemy.`);
};

btnDoNothing.onclick = () => {
  if (!pendingActionHero) return;
  const h = pendingActionHero;
  h.actedThisTurn = true;
  pendingActionHero = null;
  selectedHero = null;
  selectedAttackType = 'basic';
  modal.style.display = 'none';
  heroes.forEach(updateHeroUI);
  log(`${h.name} does nothing this turn.`);
  checkAutoEndPlayerTurn();
};

btnCancel.onclick = () => {
  pendingActionHero = null;
  modal.style.display = 'none';
  log('Attack cancelled.');
};

// Which ranged lanes are currently protected by a living melee hero on the
// given side (each melee hero carries its own `coverage`, assigned at
// deployment — either aligned to one lane, a boundary between two, or null).
function getCoveredLanes(side) {
  const covered = new Set();
  heroes.forEach(h => {
    if (h.side === side && h.type === 'melee' && !h.dead && h.coverage) {
      if (h.coverage.type === 'aligned') covered.add(h.coverage.lane);
      else if (h.coverage.type === 'boundary') h.coverage.lanes.forEach(l => covered.add(l));
    }
  });
  return covered;
}

// Melee can always reach enemy Melee. Melee can only reach a specific enemy
// Ranged lane once no living enemy Melee occupies a slot covering that lane
// (fully aligned or half-step boundary). Ranged can always attack anyone.
function getValidTargets(attacker) {
  const enemySide = attacker.side === 'player' ? 'enemy' : 'player';
  const enemyMelee = heroes.filter(h => h.side === enemySide && h.type === 'melee' && !h.dead);
  const enemyRanged = heroes.filter(h => h.side === enemySide && h.type === 'ranged' && !h.dead);
  if (attacker.type === 'ranged') return [...enemyMelee, ...enemyRanged];
  const coveredLanes = getCoveredLanes(enemySide);
  const reachableRanged = enemyRanged.filter(h => !coveredLanes.has(h.laneIndex));
  return [...enemyMelee, ...reachableRanged];
}

function onHeroClick(h) {
  if (gamePhase !== 'battle' || isAnimating || h.dead || currentTurn !== 'player') return;

  // Only left side (player) can be selected as attacker
  if (h.side === 'player') {
    if (!swapUsedThisTurn) {
      log('Swap two tiles first — attacks come after your swap.');
      return;
    }
    // Deselect if clicking the same one again
    if (selectedHero === h) {
      selectedHero = null;
      selectedAttackType = 'basic';
      updateHeroUI(h);
      log('Deselected.');
      return;
    }

    if (h.actedThisTurn) {
      log(`${h.name} already acted this turn.`);
      return;
    }

    const myBasicCost = basicCostFor(h);
    if (h.mana < myBasicCost) {
      log(`${h.name} needs at least ${myBasicCost} mana (has ${h.mana})`);
      return;
    }

    // Only heroes with multiple attack choices (specials) get the action
    // popup with a "Do Nothing" option. Normal heroes have just one option
    // (Basic Attack), so they select directly and must use it if they can.
    if (h.isSpecial) {
      pendingActionHero = h;
      modalTitle.textContent = `${h.name} ★${h.abilityName ? ' — ' + h.abilityName : ''} (mana: ${h.mana}/${h.maxMana})`;
      btnBasic.textContent = `Basic (${myBasicCost} mana → ${basicDmgFor(h)} dmg)`;
      btnBasic.style.opacity = h.mana >= myBasicCost ? '1' : '0.4';
      btnBasic.disabled = h.mana < myBasicCost;
      btnSpecial.textContent = `Special (${SPECIAL_COST} mana → ${SPECIAL_DMG} dmg)${h.abilityText ? ' — ' + h.abilityText : ''}`;
      btnSpecial.style.opacity = h.mana >= SPECIAL_COST ? '1' : '0.4';
      btnSpecial.disabled = h.mana < SPECIAL_COST;
      modal.style.display = 'flex';
      return;
    }

    // Normal character → basic only, no popup
    selectedHero = h;
    selectedAttackType = 'basic';
    heroes.forEach(updateHeroUI);
    log(`Selected ${h.name}. Tap an enemy on the right.`);
  } else {
    // Right side = enemy → only valid as target
    if (!selectedHero) {
      log('Select one of YOUR heroes on the left first.');
      return;
    }
    if (!getValidTargets(selectedHero).includes(h)) {
      if (selectedHero.type === 'melee' && h.type === 'ranged') {
        log(`${selectedHero.name}'s melee can't reach ${h.name} — an enemy melee unit is guarding that lane.`);
      } else {
        log('Not a valid target.');
      }
      return;
    }
    performAttack(selectedHero, h, selectedAttackType);
  }
}

function performAttack(attacker, target, attackType) {
  if (attacker.dead || target.dead) return;

  let cost, dmg, usedSpecial = false;
  const targetWasDamaged = target.hp < target.maxHp;
  const targetWasLowHp = target.hp <= 3;

  if (attackType === 'special') {
    if (!attacker.isSpecial) { log(`${attacker.name} has no Special attack.`); return; }
    if (attacker.mana < SPECIAL_COST) {
      log('Not enough mana for Special.');
      return;
    }
    cost = SPECIAL_COST;
    dmg = SPECIAL_DMG;
    usedSpecial = true;
    // Simple, already-implemented special effects (flat modifiers only —
    // see characters.js header for what's wired up vs. description-only).
    if (attacker.simpleAbility === 'divineStrike' && targetWasDamaged) dmg += 1;
    if (attacker.simpleAbility === 'brutal' && targetWasLowHp) dmg += 1;
  } else {
    cost = basicCostFor(attacker);
    if (attacker.mana < cost) {
      log('Not enough mana.');
      return;
    }
    dmg = basicDmgFor(attacker);
  }

  attacker.mana -= cost;
  target.hp -= dmg;
  if (target.hp <= 0) {
    target.hp = 0;
    target.dead = true;
    log(`${attacker.name}${usedSpecial ? ' ★' : ''} defeated ${target.name}!`);
  } else {
    log(`${attacker.name}${usedSpecial ? ' ★' : ''} hit ${target.name} for ${dmg} (${target.hp} HP left)`);
  }

  if (attacker.simpleAbility === 'frenzy') {
    const before = attacker.mana;
    attacker.mana = Math.min(attacker.maxMana, attacker.mana + 1);
    if (attacker.mana > before) log(`${attacker.name}'s Frenzy grants +1 mana.`);
  }

  attacker.actedThisTurn = true;
  updateHeroUI(attacker);
  updateHeroUI(target);
  if (attacker.side === 'player') {
    selectedHero = null;
    selectedAttackType = 'basic';
  }
  heroes.forEach(updateHeroUI);

  const enemiesAlive = heroes.filter(h => h.side === 'enemy' && !h.dead).length;
  const playersAlive = heroes.filter(h => h.side === 'player' && !h.dead).length;
  if (enemiesAlive === 0) {
    log('🎉 YOU WIN! All enemies defeated.');
    currentTurn = 'none';
    updateTurnUI();
    return;
  }
  if (playersAlive === 0) {
    log('💀 DEFEAT — all your heroes have fallen.');
    currentTurn = 'none';
    updateTurnUI();
    return;
  }

  checkAutoEndPlayerTurn();
}

// Once every living player hero is resolved for this turn, automatically
// hand the turn to the enemy. Player is always the attacker on the left
// side; enemy only ever acts after the player is done.
// A hero is "resolved" when: it attacked, OR (special only) it chose Do
// Nothing, OR it simply can't afford its own Basic Attack cost (normal
// heroes have no "Do Nothing" and must attack if they're able to).
function checkAutoEndPlayerTurn() {
  if (currentTurn !== 'player' || isAnimating) return;
  if (!swapUsedThisTurn) return; // a turn always includes a swap — can't end before that happens
  const livingPlayers = heroes.filter(h => h.side === 'player' && !h.dead);
  if (livingPlayers.length === 0) return;
  const allResolved = livingPlayers.every(h => {
    if (h.actedThisTurn) return true;
    if (h.mana < basicCostFor(h)) return true;
    return false;
  });
  if (allResolved) {
    log('All your heroes have acted — enemy turn begins.');
    endPlayerTurn();
  }
}

function updateTurnUI() {
  const el = document.getElementById('turn-indicator');
  if (!el) return;
  if (currentTurn === 'player') {
    el.textContent = swapUsedThisTurn
      ? 'Your Turn — swap used, attack with anyone who can'
      : 'Your Turn — swap two tiles, then attack';
    el.style.color = '#0ff';
  } else if (currentTurn === 'enemy') {
    el.textContent = 'Enemy Turn...';
    el.style.color = '#f55';
  } else {
    el.textContent = 'Battle Over';
    el.style.color = '#ff0';
  }
}

function endPlayerTurn() {
  if (currentTurn !== 'player' || isAnimating) return;
  selectedHero = null;
  selectedTile = null;
  heroes.forEach(updateHeroUI);
  currentTurn = 'enemy';
  setBoardLocked(true);
  updateTurnUI();
  log('—— Enemy turn ——');
  setTimeout(enemyTurn, 600);
}

function enemyTurn() {
  if (currentTurn !== 'enemy') return;

  // Give a little mana to 1–2 random living enemies (simulates their "match")
  const livingEnemies = heroes.filter(h => h.side === 'enemy' && !h.dead);
  if (livingEnemies.length === 0) {
    currentTurn = 'player';
    updateTurnUI();
    return;
  }

  // Boost 1 or 2 enemies
  const shuffled = [...livingEnemies].sort(() => Math.random() - 0.5);
  const toBoost = shuffled.slice(0, Math.min(2, shuffled.length));
  toBoost.forEach(h => {
    h.mana = Math.min(h.maxMana, h.mana + 3 + Math.floor(Math.random() * 3));
    updateHeroUI(h);
  });

  // Then each enemy that can attack does so once against a valid target
  const livingPlayers = heroes.filter(h => h.side === 'player' && !h.dead);
  if (livingPlayers.length === 0) {
    log('💀 All your units are down.');
    currentTurn = 'none';
    updateTurnUI();
    return;
  }

  let delay = 400;
  livingEnemies.forEach(enemy => {
    if (enemy.mana < basicCostFor(enemy)) return;
    setTimeout(() => {
      if (enemy.dead || currentTurn !== 'enemy') return;
      const targets = getValidTargets(enemy);
      if (targets.length === 0) return;
      const target = targets[Math.floor(Math.random() * targets.length)];
      const useSpecial = enemy.isSpecial && enemy.mana >= SPECIAL_COST;
      performAttack(enemy, target, useSpecial ? 'special' : 'basic');
    }, delay);
    delay += 500;
  });

  setTimeout(() => {
    if (currentTurn === 'none') return; // battle already ended mid-turn
    const playersAlive = heroes.filter(h => h.side === 'player' && !h.dead).length;
    if (playersAlive === 0) return; // defeat already logged by performAttack
    currentTurn = 'player';
    heroes.forEach(h => { h.actedThisTurn = false; });
    heroes.forEach(updateHeroUI);
    swapUsedThisTurn = false;
    setBoardLocked(false);
    log('—— Your turn ——');
    updateTurnUI();
  }, delay + 200);
}

// ---------- BATTLE START / RESTART / REDEPLOY ----------
function startBattle() {
  if (placedCount() === 0) {
    log('Place at least one hero before starting.');
    return;
  }
  gamePhase = 'battle';
  setInfoText('battle');
  document.getElementById('deploy-panel').style.display = 'none';
  document.getElementById('board-wrap').style.display = 'block';
  document.getElementById('turn-indicator').style.display = 'block';
  document.getElementById('battle-controls').style.display = 'flex';

  buildArmies();
  selectedTile = null;
  selectedHero = null;
  selectedAttackType = 'basic';
  pendingActionHero = null;
  isAnimating = false;
  currentTurn = 'player';
  swapUsedThisTurn = false;
  setBoardLocked(false);
  if (modal) modal.style.display = 'none';

  fillBoardNoMatches();
  renderBoard();
  renderBattlefield();
  updateTurnUI();

  const teamList = heroes.filter(h => h.side === 'player').map(h => h.name).join(', ');
  log(`Battle start! Your team: ${teamList}`);
}

function restartBattle() {
  if (heroes.length === 0) { startBattle(); return; }
  heroes.forEach(h => { h.hp = h.maxHp; h.mana = 0; h.dead = false; h.actedThisTurn = false; });
  selectedTile = null;
  selectedHero = null;
  selectedAttackType = 'basic';
  pendingActionHero = null;
  isAnimating = false;
  currentTurn = 'player';
  swapUsedThisTurn = false;
  setBoardLocked(false);
  if (modal) modal.style.display = 'none';
  fillBoardNoMatches();
  renderBoard();
  renderBattlefield();
  updateTurnUI();
  log('Battle restarted — same team, fresh board.');
}

function goToDeployment() {
  heroes = [];
  initDeployment();
  log('Back to deployment — pick your team.');
}

document.getElementById('btn-start-battle').onclick = startBattle;
document.getElementById('btn-restart-battle').onclick = restartBattle;
document.getElementById('btn-redeploy').onclick = goToDeployment;

// ---------- INIT ----------
initDeployment();
</script>
